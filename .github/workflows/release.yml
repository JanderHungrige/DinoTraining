# Build installers for macOS, Windows and Linux (doc 58).
#
# A **matrix, not a runner**: each installer carries its platform's uv and Tauri binary,
# so each is built on its own OS. Python and PyTorch are *not* in the installer: the app
# installs them on first start from the official sources, exactly as uv.lock pins them
# (doc 126).
#
# Every step here was run by hand on macOS first (doc 58). The order and the arguments are
# the ones that worked, not a guess at what should.

name: Release

on:
  push:
    tags: ["v*"]
    # Doc 133: a merge to main with a new version in tauri.conf.json is the release.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the installers but publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  installer:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others work — the whole point of
      # the matrix is to learn about all three from one run.
      fail-fast: false
      matrix:
        include:
          # **Formats chosen by measurement** — see doc 58 for the runs. AppImage failed
          # against the 636 MB PyInstaller tree; with the small runtime of doc 126 it may
          # work now, and doc 131's smoke test is where to find out.
          - os: windows-latest
            label: Windows
            bundles: nsis
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux
            bundles: deb
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            label: macOS (Apple silicon)
            # Doc 130: the plain .app, packed below. A .dmg invites a browser download,
            # which quarantines it, and the unsigned app is then blocked.
            bundles: app
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Tauri's Linux build needs GTK and WebKit; the other two runners ship what they need.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # --- the runtime ------------------------------------------------------------------
      #
      # uv (checksum-verified) and the backend source with its lock, nothing else. Replaced
      # the 636 MB PyInstaller sidecar (doc 126).
      - name: Stage the runtime
        shell: bash
        run: python scripts/stage_runtime.py ${{ matrix.target }}

      # --- the installer -----------------------------------------------------------------
      #
      # **Two independent npm projects**, and both are needed. `apps/frontend` builds the UI
      # that `beforeBuildCommand` invokes; `apps/desktop` holds `@tauri-apps/cli`, which is
      # what `npm run tauri` resolves. Installing only the first is what broke run #1 — the
      # sidecar built fine on all three platforms and then `tauri` was simply not on PATH.
      - name: Install frontend dependencies
        working-directory: apps/frontend
        # --legacy-peer-deps is required by this project's dependency tree.
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install the Tauri CLI
        working-directory: apps/desktop
        run: npm ci || npm install

      - name: Build the installer
        working-directory: apps/desktop
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      # --- the guard doc 54 asked for ----------------------------------------------------
      #
      # The Admin panel warns a *human* about restricted models. CI does not read warnings,
      # and a runner with a populated model cache would ship someone else's weights.
      - name: Refuse to publish a build carrying model weights
        shell: bash
        run: |
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          if find "$BUNDLE" \( -name '*.safetensors' -o -name '*.bin' -o -name 'pytorch_model*' \) | grep -q .; then
            echo "::error::Model weights found inside the bundle — see doc 54."
            find "$BUNDLE" \( -name '*.safetensors' -o -name '*.bin' -o -name 'pytorch_model*' \)
            exit 1
          fi
          echo "No model weights in the bundle."

      # --- doc 151: the Store edition, packed from this same build -------------------------
      #
      # Unsigned for the Store (Microsoft signs it after certification); a copy signed with
      # a self-signed certificate whose subject is the manifest's Publisher, for doc 153's
      # smoke test and for testing on real PCs. The test copy is never a release download.
      - name: Pack the MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = "apps/desktop/src-tauri/target/release/bundle/msix"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'msix-stage'
          python scripts/stage_msix.py --exe apps/desktop/src-tauri/target/release/dinotraining.exe --version $version --out $stage
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Join-Path $makeappx.DirectoryName 'signtool.exe'
          Write-Host "Using $($makeappx.FullName)"
          $msix = Join-Path $out "V-Rex_${version}_x64.msix"
          & $makeappx.FullName pack /o /d $stage /p $msix
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $publisher = (Get-Content packaging/msix/identity.json -Raw | ConvertFrom-Json).publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'V-Rex MSIX test' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $test = Join-Path $env:RUNNER_TEMP 'msix-test'
          New-Item -ItemType Directory -Force -Path $test | Out-Null
          $signed = Join-Path $test "V-Rex_${version}_x64_test.msix"
          Copy-Item $msix $signed
          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $signed
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Export-Certificate -Cert $cert -FilePath (Join-Path $test 'V-Rex_test.cer') | Out-Null
          "MSIX: $([math]::Round((Get-Item $msix).Length / 1MB, 1)) MB, unsigned for the Store; a test-signed copy is a workflow artifact" >> $env:GITHUB_STEP_SUMMARY

      # Doc 130: the Mac app as a tarball with its checksum, and the Homebrew formula for
      # exactly this archive. Jan copies the formula into the tap.
      - name: Pack the Mac app and render the formula
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          OUT=apps/desktop/src-tauri/target/release/bundle/macos
          NAME="V-Rex_${VERSION}_aarch64.app.tar.gz"
          tar -czf "$OUT/$NAME" -C "$OUT" V-Rex.app
          (cd "$OUT" && shasum -a 256 "$NAME" > "$NAME.sha256")
          python scripts/render_formula.py "$VERSION" "$(cut -d' ' -f1 "$OUT/$NAME.sha256")" > "$OUT/v-rex.rb"

      # Doc 126 promised small installers; the job summary shows whether they are.
      - name: Record the installer sizes
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }}"
            find apps/desktop/src-tauri/target/release/bundle \( -name '*.tar.gz' -o -name '*.exe' -o -name '*.deb' \) \
              -exec du -h {} \;
          } >> "$GITHUB_STEP_SUMMARY"

      # --- doc 131: what a user downloads, installed and started -------------------------
      #
      # Install silently, first start unattended (Python and PyTorch download, ~1 GB),
      # /health, a torch check in the installed environment, and a second start that
      # must need no setup. CPU only: the runners have no GPU.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ARCHIVE=$(ls apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz)
          DINO_ARCHIVE="$PWD/$ARCHIVE" DINO_INSTALL_DIR="$RUNNER_TEMP/Applications" bash scripts/install-mac.sh
          EXE=$(ls "$RUNNER_TEMP"/Applications/V-Rex.app/Contents/MacOS/* | head -n 1)
          python scripts/smoke_installed.py "$EXE" --work "$RUNNER_TEMP/smoke"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          DEB=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          sudo apt-get install -y "./$DEB"
          PKG=$(dpkg-deb -f "$DEB" Package)
          EXE=$(dpkg -L "$PKG" | grep '^/usr/bin/' | head -n 1)
          # The webview needs a display; xvfb-run gives it a virtual one.
          python scripts/smoke_installed.py "$EXE" --wrap "xvfb-run -a" --work "$RUNNER_TEMP/smoke"
          sudo apt-get remove -y "$PKG"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # Doc 159: the app installs under its name, V-Rex; its runtime and data keep the
          # folder they always had, DinoTraining (a machine key, kept on purpose).
          $dir = Join-Path $env:LOCALAPPDATA 'V-Rex'
          $support = Join-Path $env:LOCALAPPDATA 'DinoTraining'
          if (-not (Test-Path $dir)) { Get-ChildItem $env:LOCALAPPDATA -Directory | Select-Object Name; throw "not installed at $dir" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          # Doc 132: the runtime where the app puts it, so the uninstall check sees it.
          $runtime = Join-Path $support 'runtime'
          python scripts/smoke_installed.py $exe.FullName --runtime $runtime --work "$env:RUNNER_TEMP/smoke"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # --- doc 132: uninstall removes Python/PyTorch, keeps the user's work ---------
          $kept = Join-Path $support 'data\keep-me.txt'
          New-Item -ItemType File -Force -Path $kept | Out-Null
          if (-not (Test-Path $runtime)) { throw "no runtime at $runtime before the uninstall" }
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          # NSIS's uninstaller hands off to a copy of itself in %TEMP% (Au_.exe/Un_*.exe), so
          # -Wait returns early. Wait for that copy; deleting ~2 GB under Defender is slow.
          $deadline = (Get-Date).AddMinutes(10)
          do {
            Start-Sleep -Seconds 3
            $busy = Get-Process | Where-Object { $_.Name -like 'Au_*' -or $_.Name -like 'Un_*' }
          } while ($busy -and (Get-Date) -lt $deadline)
          if (Test-Path $runtime) {
            $left = Get-ChildItem $runtime -Recurse -Force -File -ErrorAction SilentlyContinue
            Write-Host "Left behind: $($left.Count) files, $(($left | Where-Object IsReadOnly).Count) read-only"
            $left | Select-Object -First 10 | ForEach-Object { Write-Host "$($_.FullName.Length) $($_.FullName)" }
            Write-Host "app exe still there: $(Test-Path $exe.FullName); uninstaller running: $([bool]$busy)"
            throw "the uninstall left the runtime at $runtime"
          }
          if (Test-Path $exe.FullName) { throw "the uninstall left $($exe.FullName)" }
          if (-not (Test-Path $kept)) { throw "the uninstall removed the user's data" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\V-Rex') { throw "still listed under Apps" }
          "Uninstall: runtime and app removed, user data kept, no longer under Apps." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Uninstall checks passed"

      # Doc 153: the Store edition installed, started through its package identity, set up,
      # started again and removed, like a user does it.
      - name: Smoke test (MSIX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'msix-test'
          $msix = Get-ChildItem $test -Filter *_test.msix | Select-Object -First 1
          pwsh scripts/smoke_msix.ps1 -Msix $msix.FullName -Cert (Join-Path $test 'V-Rex_test.cer')
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Keep the MSIX app's logs of a failed smoke test
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-smoke-logs
          path: |
            ~/AppData/Local/Packages/*/LocalCache/Local/com.dinotraining.app/logs/
            ~/AppData/Local/com.dinotraining.app/logs/
          if-no-files-found: ignore

      - name: Keep the app log of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke/app.log
          if-no-files-found: ignore

      # Doc 151: the test-signed MSIX and its certificate, for testing only (not released).
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: msix-test
          path: ${{ runner.temp }}/msix-test/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.sha256
            apps/desktop/src-tauri/target/release/bundle/macos/v-rex.rb
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msix/*.msix
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    name: Publish
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Doc 133. Only after all three installers were built and smoke-tested (`needs`).
      # - push to main: publish v<version> from tauri.conf.json, unless a release for it
      #   exists (a draft too): bump the version to release.
      # - a v* tag: a draft, as before, for anything published by hand.
      # - anything else (the dry run): decide and say, publish nothing.
      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          TAG="v$VERSION"
          EXISTS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          MODE=none
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then MODE=draft; fi
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            if [ -n "$EXISTS" ]; then MODE=exists; else MODE=publish; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            publish) NOTE="Publishing $TAG.";;
            exists)  NOTE="$TAG already has a release: nothing published. Bump the version in tauri.conf.json to release.";;
            draft)   NOTE="A draft release for $GITHUB_REF_NAME.";;
            *)       if [ -n "$EXISTS" ]; then STATE="exists"; else STATE="does not exist yet"; fi
                     NOTE="Not main and not a tag: nothing published (version $VERSION; a release for it $STATE)." ;;
          esac
          echo "$NOTE"
          echo "### Release: $NOTE" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.mode == 'publish' || steps.decide.outputs.mode == 'draft'
        with:
          path: artifacts

      # Unsigned (no paid certificates, Jan): Windows warns once (SmartScreen), and the
      # Mac installs through the script or Homebrew, which Gatekeeper does not block (doc 130).
      - uses: softprops/action-gh-release@v2
        if: steps.decide.outputs.mode == 'publish' || steps.decide.outputs.mode == 'draft'
        with:
          tag_name: ${{ steps.decide.outputs.mode == 'publish' && steps.decide.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.decide.outputs.mode == 'draft' }}
          make_latest: ${{ steps.decide.outputs.mode == 'publish' }}
          generate_release_notes: true
          files: |
            artifacts/installer-*/**/*.exe
            artifacts/installer-*/**/*.msix
            artifacts/**/*.deb
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sha256
            artifacts/**/v-rex.rb

      # Doc 155: the Store takes the release's MSIX by hand (no submission API for an
      # individual Partner Center account). Certification does not hold up this release.
      - name: Microsoft Store steps
        if: steps.decide.outputs.mode == 'publish' || steps.decide.outputs.mode == 'draft'
        shell: bash
        run: |
          TAG="${{ steps.decide.outputs.tag }}"
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('packaging/msix/identity.json')).get('placeholder') else 1)"; then
            STEP="The MSIX carries the placeholder identity (packaging/msix/identity.json): not for the Store until the reserved name's identity is in."
          else
            STEP="Partner Center → V-Rex → new submission → Packages: upload V-Rex_${TAG#v}_x64.msix from the $TAG release, then Submit for certification (doc 155)."
          fi
          echo "### Microsoft Store" >> "$GITHUB_STEP_SUMMARY"
          echo "$STEP" >> "$GITHUB_STEP_SUMMARY"
