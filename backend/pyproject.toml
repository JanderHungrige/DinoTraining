[project]
name = "dinotraining-backend"
version = "0.0.1"
description = "FastAPI + PyTorch ML sidecar for DinoTraining (annotate / train / infer / generate)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # MCP tool server, mounted on this same app (doc 64). Pure Python and small — the
    # sidecar's size is torch, not this. Pinned to 2.x: 1.x named the server `FastMCP`
    # and every call site here would fail to import against it.
    "mcp>=2.1,<3",

    # --- ML ---
    # NOTE: install torch/torchvision per-platform (CUDA/MPS/CPU) — see project-docs.
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.44",       # Grounding DINO + DINOv2/v3 via AutoModel
    "huggingface-hub>=0.24",    # model download manager (gated DINOv3 needs HF_TOKEN)
    "pillow>=10.3",
    "numpy>=1.26",
    # Required by transformers' DETR-family Hungarian matcher (`linear_sum_assignment`),
    # which is what fine-tuning RF-DETR trains against — doc 44. Training only; inference
    # never touches it. Verified against numpy 2.5 and torch 2.13, unlike the
    # `depth-anything-3` package Wave 6 rejected for pinning numpy<2.
    "scipy>=1.11",
    # --- Video (doc 68) ---
    # Decoding an mp4 into frames. PyAV rather than opencv or imageio because its wheels
    # bundle the ffmpeg libraries, so playback does not become a system-ffmpeg prerequisite
    # the installer cannot satisfy. torchvision is not an option: its video APIs were
    # removed before 0.28, which is the version this app pins.
    #
    # Costs roughly 35 MB in the sidecar, against doc 56's measured 636 MB.
    "av>=13",
    # --- Data / metadata ---
    # SQLite via stdlib; SQLAlchemy optional if the store grows.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Matches the dev venv. requires-python stays >=3.11, but numpy's shipped stubs
# use 3.12-only `type` statements, which mypy rejects when targeting 3.11.
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit, because setuptools' flat-layout discovery finds *every* top-level directory and
# then refuses when there is more than one. Adding `bundling/` broke `pip install .` the
# moment it appeared — a good argument for saying what ships rather than letting it be
# inferred. `bundling/` is build tooling and is deliberately not part of the wheel.
[tool.setuptools.packages.find]
include = ["app*"]
