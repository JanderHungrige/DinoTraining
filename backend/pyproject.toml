[project]
name = "dinotraining-backend"
version = "0.1.4"
description = "FastAPI + PyTorch ML sidecar for V-Rex (annotate / train / infer / generate)."
requires-python = ">=3.12,<3.13"  # the bundled Python (doc 126); tests run on it
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # MCP tool server, mounted on this same app (doc 64). Pure Python and small — the
    # sidecar's size is torch, not this. Pinned to 2.x: 1.x named the server `FastMCP`
    # and every call site here would fail to import against it.
    "mcp>=2.1,<3",
    # Doc 123's MLflow client. Declared, not inherited through mcp (doc 125).
    "httpx>=0.27",
    # Doc 147: S3, Azure Blob and Google Cloud Storage through one Rust client; 5 MB
    # against 23 MB for boto3 + azure-storage-blob + google-cloud-storage.
    "obstore>=0.11,<0.12",

    # --- ML ---
    # torch / torchvision are chosen per machine: the `cpu`, `cu126` and `cu130` extras
    # below (doc 125). Exactly one is installed.
    "transformers>=4.44",       # Grounding DINO + DINOv2/v3 via AutoModel
    "huggingface-hub>=0.24",    # model download manager (gated DINOv3 needs HF_TOKEN)
    "pillow>=10.3",
    "numpy>=1.26",
    # Required by transformers' DETR-family Hungarian matcher (`linear_sum_assignment`),
    # which is what fine-tuning RF-DETR trains against — doc 44. Training only; inference
    # never touches it. Verified against numpy 2.5 and torch 2.13, unlike the
    # `depth-anything-3` package Wave 6 rejected for pinning numpy<2.
    "scipy>=1.11",
    # --- Video (doc 68) ---
    # Decoding an mp4 into frames. PyAV rather than opencv or imageio because its wheels
    # bundle the ffmpeg libraries, so playback does not become a system-ffmpeg prerequisite
    # the installer cannot satisfy. torchvision is not an option: its video APIs were
    # removed before 0.28, which is the version this app pins.
    #
    # Costs roughly 35 MB in the sidecar, against doc 56's measured 636 MB.
    "av>=13",
    # --- Data / metadata ---
    # SQLite via stdlib; SQLAlchemy optional if the store grows.
]

[project.optional-dependencies]
# Doc 125: one PyTorch per machine. `cpu` is also the Mac's (PyPI's macOS wheels carry MPS).
cpu = ["torch==2.13.0", "torchvision==0.28.0"]
# CUDA exists only for Windows and Linux; on a Mac these extras are empty.
cu126 = [
    "torch==2.13.0; sys_platform != 'darwin'",
    "torchvision==0.28.0; sys_platform != 'darwin'",
]
cu130 = [
    "torch==2.13.0; sys_platform != 'darwin'",
    "torchvision==0.28.0; sys_platform != 'darwin'",
]
# Doc 122: ONNX export of trained heads, checked with onnxruntime. Optional at runtime:
# without them an export bundle simply has no model.onnx and says why.
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Matches the dev venv. requires-python stays >=3.11, but numpy's shipped stubs
# use 3.12-only `type` statements, which mypy rejects when targeting 3.11.
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Explicit, because setuptools' flat-layout discovery finds *every* top-level directory and
# then refuses when there is more than one — a good argument for saying what ships rather
# than letting it be inferred.
[tool.setuptools.packages.find]
include = ["app*"]

# --- Doc 125: the lock users install from ------------------------------------------------
[tool.uv]
# Runs from source (`python -m app`), never installed as a package.
package = false
# Exactly one PyTorch variant.
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]
# The three platforms the app ships for. PyTorch has no Intel-Mac wheels since 2.3.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
