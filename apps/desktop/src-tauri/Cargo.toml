[package]
name = "dinotraining"
version = "0.0.1"
description = "DinoTraining — annotate, train, infer, generate."
authors = ["DinoTraining contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# The library target is what the mobile/desktop entrypoints share; main.rs is a thin shim.
[lib]
name = "dinotraining_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["time", "process", "signal", "macros"] }
thiserror = "2"
log = "0.4"

[features]
# Enabled by `tauri dev`/`tauri build` when a custom protocol is in use.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
