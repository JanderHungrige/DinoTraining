# Doc 133. `current` is a link the updater switches in one rename; nginx resolves it per
# request, so a new site needs no reload.
server {
    listen 80;
    server_name _;
    root /site/current;
    index index.html;

    # Written by the updater beside the sites, so it survives every switch.
    location = /latest.json {
        alias /site/latest.json;
        add_header Cache-Control "no-cache";
    }

    location /media/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
