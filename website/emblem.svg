<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="V-Rex">
  <!-- Doc 134: an own emblem — a coin, a T-rex skeleton facing right, yellow on black. -->
  <title>V-Rex</title>
  <g id="coin">
    <circle cx="256" cy="256" r="250" fill="#141414"/>
    <circle cx="256" cy="256" r="229" fill="none" stroke="#F5C518" stroke-width="12"/>
    <circle cx="256" cy="256" r="209" fill="#F5C518"/>
  </g>
  <g id="figure" transform="translate(252 268) scale(0.95) translate(-259 -243)">
  <g id="skeleton" fill="#141414" stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail: a chain of vertebrae, nearly straight, tapering -->
    <path d="M168 240 C 140 246 116 250 96 254" fill="none" stroke-width="22" stroke-dasharray="16 6" stroke-linecap="butt"/>
    <path d="M96 254 C 84 256 74 259 64 263" fill="none" stroke-width="14" stroke-dasharray="11 5" stroke-linecap="butt"/>
    <!-- back and neck -->
    <path d="M168 240 C 196 226 228 224 256 232" fill="none" stroke-width="24" stroke-dasharray="16 5" stroke-linecap="butt"/>
    <path d="M256 232 C 282 220 298 196 306 168" fill="none" stroke-width="22" stroke-dasharray="14 5" stroke-linecap="butt"/>
    <!-- ribs -->
    <path d="M250 240 C 258 266 254 288 240 304" fill="none" stroke-width="9"/>
    <path d="M233 238 C 241 266 237 290 222 306" fill="none" stroke-width="9"/>
    <path d="M216 237 C 223 264 219 287 205 302" fill="none" stroke-width="9"/>
    <path d="M199 238 C 204 260 201 280 190 294" fill="none" stroke-width="8"/>
    <!-- the small arms -->
    <path d="M266 246 L 284 270 L 298 263" fill="none" stroke-width="8"/>
    <!-- pelvis -->
    <ellipse cx="172" cy="248" rx="30" ry="18" transform="rotate(-16 172 248)"/>
    <!-- far leg -->
    <path d="M164 256 L 146 318 L 124 366 L 160 382" fill="none" stroke-width="15"/>
    <!-- near leg -->
    <path d="M182 254 L 220 318 L 196 370 L 240 388" fill="none" stroke-width="20"/>
    <circle cx="220" cy="318" r="13"/>
    <circle cx="196" cy="370" r="10"/>
    <circle cx="146" cy="318" r="10"/>
    <!-- skull, mouth open -->
    <path d="M296 160 C 298 128 326 102 366 98 C 400 95 430 106 448 128 C 454 137 450 147 440 149 L 328 168 C 309 172 296 171 296 160 Z"/>
    <path d="M314 178 L 440 198 C 449 200 447 211 436 212 L 344 214 C 324 212 310 198 314 178 Z"/>
    <!-- teeth -->
    <path d="M342 163 l 6 14 l 6 -15 Z M362 160 l 6 14 l 6 -15 Z M382 157 l 6 14 l 6 -15 Z M402 154 l 6 13 l 6 -14 Z M421 151 l 5 12 l 5 -13 Z" stroke-width="2"/>
    <path d="M352 205 l 6 -13 l 6 14 Z M372 207 l 6 -13 l 6 14 Z M392 208 l 6 -13 l 6 14 Z M412 209 l 5 -12 l 5 13 Z" stroke-width="2"/>
  </g>
  <!-- openings in the skull: eye, the large window before it, the nostril -->
  <g fill="#F5C518">
    <circle cx="340" cy="126" r="12"/>
    <ellipse cx="381" cy="133" rx="15" ry="9" transform="rotate(-8 381 133)"/>
    <ellipse cx="427" cy="124" rx="8" ry="5"/>
  </g>
  </g>
</svg>
